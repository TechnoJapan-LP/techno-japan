<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- サイト内で唯一セキュリティヘッダを持っていなかったページ（2026-08-06 監査）。
     ここは他ハブと違い外部スクリプト（GA・Behold・Google Fonts）を一切読まず、
     app.js からのインラインハンドラも全て除去したので、
     script-src に 'unsafe-inline' を入れずに済む＝サイト内で最も厳しい CSP にできる。
     app.js を編集して属性ハンドラを足すと、ここで黙ってブロックされる。
     追加したいときは addEventListener を使うこと。AUDIT §9-44。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), interest-cohort=()">
<title>TJ APP — FESTIVAL COMPANION (仮)</title>
<meta name="description" content="Techno Japan のフェスティバル・コンパニオン。ラインナップ確認とマイタイムテーブル。オフライン対応。">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex"><!-- 仮名のうちは非インデックス -->
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <a class="app-logo" href="#/">TJ<span class="dot">·</span>APP</a>
  <div class="app-header-right">
    <span id="net-status" class="net-status" title="接続状態"></span>
    <a class="app-back-site" href="../festivals.html">TECHNO JAPAN ↗</a>
  </div>
</header>

<main id="screen" class="screen"></main>

<nav id="fest-tabs" class="fest-tabs" hidden>
  <a id="tab-lineup" href="#">LINEUP</a>
  <a id="tab-my" href="#">MY SETS <span id="my-count" class="my-count"></span></a>
</nav>

<script src="app.js"></script>
</body>
</html>
