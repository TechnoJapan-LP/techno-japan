<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #080808;
  --text: #f0ede8;
  --font-display: 'Bebas Neue', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --font-body: 'DM Sans', sans-serif;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body);
  overflow-x: hidden; cursor: none; opacity: 0; animation: bodyFadeIn 0.8s ease forwards;
}
@keyframes bodyFadeIn { to { opacity: 1; } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
a { color: inherit; text-decoration: none; }

/* CURSOR */
.cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; border-radius: 50%; pointer-events: none; z-index: 99999; mix-blend-mode: difference; }
.cursor-dot { width: 6px; height: 6px; background: var(--text); transform: translate(-50%, -50%); }
.cursor-ring { width: 36px; height: 36px; border: 1px solid var(--text); transform: translate(-50%, -50%); transition: transform 0.15s ease-out, width 0.3s ease, height 0.3s ease; }

/* NAV */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 28px 40px; mix-blend-mode: difference; }
nav .logo { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; }
nav .nav-links { display: flex; gap: 32px; align-items: center; }
nav .nav-links a { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.6; transition: opacity 0.3s ease; }
nav .nav-links a:hover { opacity: 1; }
nav .nav-links .nav-dropdown { position: relative; display: flex; align-items: center; }
nav .nav-links .nav-dropdown > a { cursor: pointer; }
nav .nav-dropdown-menu { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); padding-top: 12px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
nav .nav-dropdown:hover .nav-dropdown-menu { opacity: 1; pointer-events: auto; }
nav .nav-dropdown-menu-inner { background: rgba(8,8,8,0.95); border: 1px solid rgba(240,237,232,0.1); backdrop-filter: blur(12px); padding: 12px 0; min-width: 160px; display: flex; flex-direction: column; }
nav .nav-dropdown-menu-inner a { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 24px; opacity: 0.5; transition: opacity 0.2s ease, background 0.2s ease; white-space: nowrap; }
nav .nav-dropdown-menu-inner a:hover { opacity: 1; background: rgba(240,237,232,0.05); }

/* HAMBURGER */
.nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; z-index: 10001; background: none; border: none; position: fixed; top: 28px; right: 48px; }
.nav-hamburger span { display: block; width: 22px; height: 2px; background: var(--text); transition: transform 0.3s ease, opacity 0.3s ease; }
.nav-hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(4px, 5px); }
.nav-hamburger.active span:nth-child(2) { opacity: 0; }
.nav-hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(4px, -5px); }
.nav-overlay { display: none; position: fixed; inset: 0; background: #080808; z-index: 10000; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.nav-overlay.active { display: flex; }
.nav-overlay a { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6; transition: opacity 0.3s ease; }
.nav-overlay a:hover { opacity: 1; }
.nav-overlay .nav-overlay-sub { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: -8px; }
.nav-overlay .nav-overlay-sub a { font-size: 10px; opacity: 0.35; }
.nav-overlay .nav-back { position: absolute; bottom: 48px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; opacity: 0.45; transition: opacity 0.3s ease; cursor: pointer; background: none; border: none; color: var(--text); text-transform: uppercase; }
.nav-overlay .nav-close { position: absolute; top: 28px; right: 48px; width: 28px; height: 28px; background: none; border: none; cursor: pointer; z-index: 10001; }
.nav-overlay .nav-close::before, .nav-overlay .nav-close::after { content: ''; position: absolute; top: 50%; left: 50%; width: 22px; height: 2px; background: var(--text); }
.nav-overlay .nav-close::before { transform: translate(-50%, -50%) rotate(45deg); }
.nav-overlay .nav-close::after { transform: translate(-50%, -50%) rotate(-45deg); }

/* PAGE HEADER */
.page-header { padding: 160px 40px 60px; border-bottom: 1px solid rgba(240,237,232,0.08); }
.page-title { font-family: var(--font-display); font-size: clamp(64px, 12vw, 180px); line-height: 0.9; text-transform: uppercase; opacity: 0; animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.2s; }
.page-subtitle { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; opacity: 0; animation: fadeSlideUp 0.6s ease forwards; animation-delay: 0.4s; color: rgba(240,237,232,0.5); margin-top: 16px; }

/* SECTIONS */
.fav-main { max-width: 1400px; margin: 0 auto; padding: 60px 40px 120px; }
.fav-section { margin-bottom: 80px; }
.fav-section-header {
  display: flex; align-items: baseline; gap: 16px; padding-bottom: 16px;
  border-bottom: 1px solid rgba(240,237,232,0.08); margin-bottom: 32px;
}
.fav-section-title {
  font-family: var(--font-display); font-size: clamp(28px, 4vw, 48px);
  text-transform: uppercase; line-height: 1;
}
.fav-section-count {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em;
  opacity: 0.4;
}

.fav-grid {
  display: grid; gap: 6px;
  grid-template-columns: repeat(3, 1fr);
}
@media (max-width: 900px) { .fav-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .fav-grid { grid-template-columns: 1fr; } }

.fav-card {
  position: relative; aspect-ratio: 4/3;
  background: rgba(240,237,232,0.04);
  border: 1px solid rgba(240,237,232,0.06);
  overflow: hidden; cursor: pointer;
  transition: border-color 0.3s ease, transform 0.3s ease;
  display: block;
}
.fav-card:hover { border-color: rgba(240,237,232,0.2); transform: translateY(-4px); }
.fav-card-img {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
}
.fav-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0) 100%);
}
.fav-card-content {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px;
}
.fav-card-meta {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em;
  text-transform: uppercase; opacity: 0.5; margin-bottom: 6px;
}
.fav-card-name {
  font-family: var(--font-display); font-size: 22px;
  text-transform: uppercase; line-height: 1.05;
}
.fav-card-fav-mount {
  position: absolute; top: 12px; right: 12px;
  z-index: 5;
}

/* EMPTY STATE */
.fav-empty {
  text-align: center; padding: 80px 20px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em;
  opacity: 0.3; text-transform: uppercase;
}
.fav-empty a {
  text-decoration: underline; opacity: 0.6;
}
.fav-empty a:hover { opacity: 1; }

.fav-totals-empty {
  text-align: center; padding: 120px 20px;
}
.fav-totals-empty-title {
  font-family: var(--font-display); font-size: clamp(36px, 5vw, 64px);
  text-transform: uppercase; margin-bottom: 16px; opacity: 0.4;
}
.fav-totals-empty-desc {
  font-family: var(--font-body); font-weight: 200; font-size: 14px;
  line-height: 1.8; opacity: 0.4; max-width: 400px; margin: 0 auto 32px;
}
.fav-totals-empty-cta {
  display: inline-block;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; padding: 14px 28px;
  border: 1px solid rgba(240,237,232,0.3); transition: border-color 0.3s ease, opacity 0.3s ease;
  opacity: 0.7;
}
.fav-totals-empty-cta:hover { border-color: rgba(240,237,232,0.6); opacity: 1; }

/* FOOTER */
footer { padding: 60px 40px 40px; border-top: 1px solid rgba(240,237,232,0.08); }
.footer-top { display: flex; justify-content: space-between; align-items: center; gap: 32px; flex-wrap: wrap; }
.footer-logo { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; }
.footer-links { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.footer-links a { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.5; transition: opacity 0.3s ease; }
.footer-links a:hover { opacity: 1; }
.footer-copy { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; opacity: 0.3; }

@media (max-width: 900px) {
  nav { padding: 20px 24px; }
  .page-header { padding: 140px 24px 40px; }
  .fav-main { padding: 40px 24px 80px; }
  .fav-section { margin-bottom: 60px; }
}
@media (max-width: 768px) {
  .nav-hamburger { display: flex; top: 20px; right: 24px; }
  .nav-overlay .nav-close { top: 20px; right: 24px; }
  nav .nav-links { display: none; }
}
@media (hover: none) and (pointer: coarse) {
  body { cursor: auto; }
  .cursor-dot, .cursor-ring { display: none; }
  .nav-hamburger, .nav-overlay .nav-close, .nav-overlay .nav-back, .nav-overlay a, .fav-card { cursor: pointer; }
}

/* SHARED Schema for org */

/* ===== MOBILE/PERFORMANCE OPTIMIZATIONS ===== */
* { -webkit-tap-highlight-color: transparent; }
@media (max-width: 768px) {
  input, textarea, select { font-size: 16px !important; } /* prevent iOS zoom */
  /* Larger tap targets for fav hearts and share buttons on touch */
  .tj-fav-heart { width: 38px; height: 38px; }
  .tj-fav-heart.sm { width: 32px; height: 32px; }
  .share-btn, .article-share-btn { width: 38px; height: 38px; }
}
/* Reduce motion for accessibility */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

<script>
const gradients = [
  'linear-gradient(135deg, #1a0533 0%, #4a1942 40%, #c2185b 100%)',
  'linear-gradient(135deg, #0d1b2a 0%, #1b2838 40%, #415a77 100%)',
  'linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%)',
  'linear-gradient(135deg, #2d1b2e 0%, #1a1a2e 50%, #0f1123 100%)',
  'linear-gradient(135deg, #2e1b1b 0%, #1a0f0f 50%, #120a0a 100%)',
];

function makeCardImg(image, idx) {
  if (image) return `background-image:url('${image}')`;
  return `background:${gradients[idx % gradients.length]}`;
}

function render() {
  const main = document.getElementById('fav-main');
  const festIds = window.tjFav.list('festival');
  const artistIds = window.tjFav.list('artist');
  const venueIds = window.tjFav.list('venue');

  const total = festIds.length + artistIds.length + venueIds.length;
  document.getElementById('page-subtitle').textContent = total === 0
    ? 'NOTHING SAVED YET'
    : `${total} SAVED · FESTIVALS · ARTISTS · VENUES`;

  if (total === 0) {
    main.innerHTML = `
      <div class="fav-totals-empty">
        <div class="fav-totals-empty-title">Empty for now.</div>
        <div class="fav-totals-empty-desc">Tap the heart icon on any festival, artist, or venue to save it here for later.</div>
        <a href="festivals.html" class="fav-totals-empty-cta">Browse Festivals</a>
      </div>`;
    return;
  }

  let html = '';

  // Festivals
  const festivals = (typeof FESTIVALS !== 'undefined' ? FESTIVALS : []).filter(f => festIds.includes(f.id));
  if (festivals.length) {
    html += `
      <div class="fav-section">
        <div class="fav-section-header">
          <div class="fav-section-title">Festivals</div>
          <div class="fav-section-count">${festivals.length} SAVED</div>
        </div>
        <div class="fav-grid">
          ${festivals.map((f, i) => `
            <a href="festivals.html#festival/${f.id}" class="fav-card">
              <div class="fav-card-img" style="${makeCardImg(f.image, i)}"></div>
              <div class="fav-card-overlay"></div>
              <div class="fav-card-content">
                <div class="fav-card-meta">${f.city || ''} ${f.date ? '— ' + f.date.split('/')[0] : ''}</div>
                <div class="fav-card-name">${f.name}</div>
              </div>
              <div class="fav-card-fav-mount" data-fav-mount="festival" data-fav-id="${f.id}" onclick="event.preventDefault();event.stopPropagation()"></div>
            </a>
          `).join('')}
        </div>
      </div>`;
  }

  // Artists
  const artists = (typeof ARTISTS !== 'undefined' ? ARTISTS : []).filter(a => artistIds.includes(a.id));
  if (artists.length) {
    html += `
      <div class="fav-section">
        <div class="fav-section-header">
          <div class="fav-section-title">Artists</div>
          <div class="fav-section-count">${artists.length} SAVED</div>
        </div>
        <div class="fav-grid">
          ${artists.map((a, i) => `
            <a href="artists.html#artist/${a.id}" class="fav-card">
              <div class="fav-card-img" style="${makeCardImg(a.image, i)}"></div>
              <div class="fav-card-overlay"></div>
              <div class="fav-card-content">
                <div class="fav-card-meta">${a.country || a.city || ''}${a.genre ? ' — ' + (Array.isArray(a.genre) ? a.genre.join(' / ') : a.genre) : ''}</div>
                <div class="fav-card-name">${a.name}</div>
              </div>
              <div class="fav-card-fav-mount" data-fav-mount="artist" data-fav-id="${a.id}" onclick="event.preventDefault();event.stopPropagation()"></div>
            </a>
          `).join('')}
        </div>
      </div>`;
  }

  // Venues
  const venues = (typeof VENUES !== 'undefined' ? VENUES : []).filter(v => venueIds.includes(v.id));
  if (venues.length) {
    html += `
      <div class="fav-section">
        <div class="fav-section-header">
          <div class="fav-section-title">Venues</div>
          <div class="fav-section-count">${venues.length} SAVED</div>
        </div>
        <div class="fav-grid">
          ${venues.map((v, i) => `
            <a href="venues.html#venue/${v.id}" class="fav-card">
              <div class="fav-card-img" style="${makeCardImg(v.image, i)}"></div>
              <div class="fav-card-overlay"></div>
              <div class="fav-card-content">
                <div class="fav-card-meta">${v.city || ''}${v.area ? ' — ' + v.area : ''}</div>
                <div class="fav-card-name">${v.name}</div>
              </div>
              <div class="fav-card-fav-mount" data-fav-mount="venue" data-fav-id="${v.id}" onclick="event.preventDefault();event.stopPropagation()"></div>
            </a>
          `).join('')}
        </div>
      </div>`;
  }

  main.innerHTML = html;

  // Mount hearts
  if (window.tjFav) {
    main.querySelectorAll('[data-fav-mount]').forEach(mount => {
      const type = mount.dataset.favMount;
      const id = mount.dataset.favId;
      window.tjFav.attachHeart(mount, type, id);
    });
  }
}

document.addEventListener('tj-fav-change', render);
render();

/* CURSOR */
const dot = document.querySelector('.cursor-dot');
const ring = document.querySelector('.cursor-ring');
let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px'; });
function animateRing() { ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15; ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px'; requestAnimationFrame(animateRing); }
animateRing();
</script>
