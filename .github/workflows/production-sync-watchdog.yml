name: Production sync watchdog

# Publishの失敗通知と、本番/mainの不一致検知を別経路で行う。
# 空コミットでPublish pipeline自体が起動しない場合も、定期照合で検知する。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish pipeline', 'Generate sitemap.xml & rss.xml']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-sync-watchdog
  cancel-in-progress: true

jobs:
  scheduled-check:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Compare main and production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/check_production_sync.mjs

  workflow-failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          FAILED_STEPS="$(gh run view "$RUN_ID" --json jobs --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)"
          # --log-failed は「ジョブ名<TAB>ステップ名<TAB>時刻 本文」。3列目を取り、先頭の時刻を落とす。
          # （sed の \t は macOS では効かないので awk で列を切る）
          ERROR_LINES="$(gh run view "$RUN_ID" --log-failed 2>/dev/null | awk -F'\t' 'NF>=3 {print $3}' | sed -E 's/^[^ ]+Z +//' | grep -E '❌|##\[error\]' | grep -v 'Process completed' | head -5 || true)"

          if [ -z "$FAILED_STEPS" ]; then
            FAILED_STEPS="失敗ステップを取得できませんでした"
          fi
          if [ -z "$ERROR_LINES" ]; then
            ERROR_LINES="失敗ログを取得できませんでした"
          fi

          case "$FAILED_STEPS" in
            *"Fetch data"*)
              NEXT_ACTION="CMS のデータ不整合。❌ 行の ID（参照切れ・重複）を CMS で直してから Publish Now"
              ;;
            *"Ensure referenced images"*)
              NEXT_ACTION="画像が Drive にまだ無い。CMS のアップロード完了を確認して Publish Now"
              ;;
            *"structured data"*)
              NEXT_ACTION='生成物の検査。Publish pipeline を手動で再実行（gh workflow run "Publish pipeline"）。同じ失敗なら開発者へ'
              ;;
            *"Commit generated output"*)
              NEXT_ACTION="他のワークフローと競合。数分待って Publish pipeline を再実行"
              ;;
            *)
              NEXT_ACTION="Run のログを開発者に共有"
              ;;
          esac

          ERROR_LINES_ONE_LINE="$(printf '%s\n' "$ERROR_LINES" | awk 'NR>1 {printf " / "} {printf "%s", $0}')"
          echo "::error title=${FAILED_STEPS}::❌ 行: ${ERROR_LINES_ONE_LINE} | 次にやること: ${NEXT_ACTION} | 失敗したRun: ${RUN_URL}"
          exit 1
