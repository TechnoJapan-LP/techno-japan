name: Monthly popular

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  popular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # GITHUB_TOKEN の push は他のワークフローを起動しないため、PAT で push して deploy-pages を動かす
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Fetch monthly popular from GA4
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: node scripts/fetch-popular.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LP/data/popular.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update monthly popular (GA4)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main
              if git push; then break; fi
              echo "push が弾かれました。取り込んでやり直します [$i/3]"
              sleep $((i * 5))
            done
          fi
