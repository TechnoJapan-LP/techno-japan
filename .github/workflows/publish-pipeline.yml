name: Publish pipeline

# CMS の Publish Now（LP/data.js の単独コミット）専用の一本道。
#
# ■ なぜ分けたか
#
#   Publish は data.js だけをコミットする。生成物（詳細ページ・sitemap・rss）は
#   追従していないので、deploy-pages.yml の「生成物がコミット内容と一致するか」
#   検査に必ず引っかかっていた。一方 generate-meta.yml が並行で再生成し
#   [skip ci] でコミットするため、正しくなった生成物は**デプロイされないまま**
#   次の人手 push まで残っていた。赤いだけでなく配信が遅れる。
#
#   3つのワークフローが同じ push で並行に走り、互いの結果を見ていなかったのが原因。
#   ここで fetch → build → 検査 → sitemap/RSS → commit → deploy を
#   一本の順序に畳む。
#
# ■ 無限ループにならない理由
#
#   生成物のコミットに [skip ci] を付けるので push は再トリガしない。
#   デプロイは同じ run の working tree（./LP）から行うため、
#   新しいコミットを拾い直す必要がない。
#
# ■ 停止条件
#
#   fetch のスキーマ検証（参照切れ・ID規約違反）と各ガードは失敗で止める。
#   壊れたデータを配信しないことを、赤いバッジより優先する。
#   Lighthouse は deploy 成功後に別ワークフローで走る品質警告で、ここには含めない。

# 【既知の重なり】1つの push に LP/data.js と他の LP/** が同時に含まれると、
# deploy-pages.yml（他のファイルに反応）とこちら（data.js に反応）の両方が起動する。
# 実運用では CMS の Publish が data.js を単独でコミットし、人手の push は
# data.js を含まないので起きない。起きた場合も concurrency: pages で直列化され、
# 両方とも同じ内容を再生成してデプロイするだけで壊れない（無駄なだけ）。
# パスフィルタでは「data.js だけが変わった push」を表現できないため、
# 複雑な条件分岐を足すよりこの重なりを許容する。
on:
  push:
    branches: [main]
    paths:
      - 'LP/data.js'
  workflow_dispatch:

permissions:
  contents: write        # 生成物のコミット
  pages: write           # デプロイ
  id-token: write

# deploy-pages.yml と同じグループ。Pages のデプロイが競合しないようにする。
concurrency:
  group: pages
  # deploy-pages.yml と同じ理由で false。実行中は途中で止めない。
  # 「実行中1本＋最新の待機1本」だけが残り、最新データが必ず最後に公開される。
  # 詳細は deploy-pages.yml の concurrency コメントと AUDIT §9-50。
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # check_asset_versions が merge-base を取る

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # シート → LP/data/*.json。スキーマ検証に落ちたらここで止まる。
      # 2026-08-04 に FESTIVAL_ID の参照切れ（fulirock）で実際に止まった。
      # data.js だけ新しく data/*.json が古い、という食い違いを持ち込ませない。
      - name: Fetch data from spreadsheet
        run: npm run fetch

      - name: Build detail pages
        run: node scripts/build-detail-pages.mjs

      # 検査は再生成した状態に対して行う。
      # deploy-pages.yml の「生成物がコミット内容と一致するか」はここでは見ない。
      # あれは人手 push で再生成漏れを止めるためのもので、今まさに再生成した
      # 直後のこの経路では常に真になり、意味を持たない。
      - name: Check asset cache busting
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -Eq '^0+$'; then
            compare="$BEFORE_SHA"
          else
            compare="HEAD^"
          fi
          echo "Asset comparison base: $compare"
          python3 scripts/check_asset_versions.py --base "$compare"

      - name: Check service worker routing
        run: node scripts/check_sw_routing.mjs

      # 生成スクリプトへの ?v べた書き禁止。べた書きがあると HTML の ?v を
      # 手で上げても次のビルドで戻り、同じデプロイ失敗を繰り返す（AUDIT §9-58）。
      - name: Check no hardcoded asset versions
        run: python3 scripts/check_no_hardcoded_versions.py

      - name: Check regression thresholds
        run: python3 scripts/check_regressions.py

      # 404 にならないリンク切れ（廃止済み SPA ハッシュ）を含む内部リンク検査。
      # トップ・検索・お気に入りから詳細へ行けない状態が4日続いた（AUDIT §9-44）。
      - name: Check internal links
        run: python3 scripts/check_internal_links.py

      # CMS は prompt() でブラウザ検査ができないので、cms.js を VM に読んで
      # 開催回まわりの回帰を見る（AUDIT §9-47）。
      - name: Check CMS editions logic
        run: node scripts/check_cms_editions.mjs

      # Author 候補（表記ゆれ防止）の回帰。cms は prompt() でブラウザ検査
      # できないため VM で cms.js を叩く（AUDIT §9-52）。
      - name: Check CMS authors autocomplete
        run: node scripts/check_cms_authors.mjs

      # セッション失効からの自動回復。ここが壊れると翻訳・保存など
      # 個々の機能が「静かに使えなくなる」（AUDIT §9-53）。
      - name: Check CMS auth retry
        run: node scripts/check_cms_auth_retry.mjs

      # LINEUP 入力（IME の変換確定・候補の暗黙置換・表記保持）。
      # §9-25 の「公式表記を機械復元して30件壊した」再発防止も兼ねる。
      - name: Check CMS lineup input
        run: node scripts/check_cms_lineup.mjs

      # 施設名ジオコーディングが日本国外の座標を入れないこと（AUDIT §9-59）。
      - name: Check CMS geocode
        run: node scripts/check_cms_geocode.mjs

      # AI機能が本文を確定させてから読むこと（書いたのに動かない、を防ぐ）。
      - name: Check CMS AI body sync
        run: node scripts/check_cms_ai_body.mjs

      # GAS の AI ハンドラ（貼り替え用コード）の検査。実体は Apps Script 側に
      # あり普段は見えないので、少なくとも管理下のコードは壊さない（AUDIT §9-54）。
      - name: Check GAS AI handlers
        run: node scripts/check_gas_ai.mjs

      - name: Verify Chrome is available
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else echo "::error::headless Chrome が見つかりません"; exit 1; fi

      # 入力欄が別の要素に覆われて押せない、を防ぐ。CSS の重なりは
      # コードを読んでも分からないので、実際に描画して矩形を測る（§9-63）。
      # 詰まった CI を外す仕組みは、普段は何もしないので壊れても気づけない。
      # 判断部分（動作中・承認待ちを殺さない等）をここで毎回試験する（§9-65）。
      # 押した時点では成功に見えて、20分後に CI が赤くなる状態を作らない（§9-66）。
      # Publish が「列を落とす経路」でデータを取っていないこと（§9-67）。
      # リポジトリの .gs と GAS の実物がずれていないか（貼り忘れ検出。§9-74）。
      # 一時的な通信失敗で画像同期が落ちないこと（§9-75）。
      - name: Check image sync retry
        run: python3 scripts/check_sync_retry.py

      # 構造化データは目に見えない。壊れても消えても画面は変わらない（§9-79）。
      - name: Check structured data & AI surface
        run: node scripts/check_jsonld.mjs

      - name: Check GAS sync
        run: node scripts/check_gas_sync.mjs

      - name: Check CMS fetch path
        run: node scripts/check_cms_fetch_path.mjs

      - name: Check CMS publish guard
        run: node scripts/check_cms_publish_guard.mjs

      - name: Check CI unstick logic
        run: node scripts/check_unstick_queue.mjs

      - name: Check CMS form layout (no overlap)
        run: node scripts/check_cms_layout.mjs

      # 地図が東京以外の会場も出すこと。初期化のタイミング依存も見る（§9-76）。
      # 会場一覧の地図が、データにある全都市を出すこと（§9-78）。
      - name: Check venue hub maps cover all cities
        run: node scripts/check_venue_maps.mjs

      - name: Check club map covers all cities
        run: node scripts/check_map_nationwide.mjs

      - name: Check hub pages render (JS health)
        run: python3 scripts/check_hub_pages.py

      # 検査を通ってから sitemap/RSS を作る。順序が逆だと、落ちる内容の
      # sitemap を先に書いてしまう。
      - name: Generate sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Generate rss.xml
        run: python3 scripts/generate-rss.py

      # [skip ci] が無いと、この push が自分自身を再トリガして無限に回る。
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # LP/ だけ。リポジトリ直下の data/（data/inbox の調査JSON）は
          # 人が書く作業ファイルで、このパイプラインの生成物ではない。
          git add -A LP/
          if git diff --cached --quiet; then
            echo "生成物に変更なし"
          else
            git commit -m "chore: regenerate detail pages, sitemap.xml & rss.xml [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 開発中のコンパニオンアプリは本番に出さない（deploy-pages.yml と同じ扱い）。
      - name: Exclude in-development app from deploy
        run: rm -rf ./LP/app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./LP

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
