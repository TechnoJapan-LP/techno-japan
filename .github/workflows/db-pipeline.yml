# TECHNO JAPAN DB（Airtable）の承認制更新パイプライン。
#
# workflow_dispatch は dry_run が既定で、「書き込む」を明示的に選んだときだけ本体へ反映する。
# sync-site は日次 cron 済み。公開済みサイトの状態を冪等に自動反映する。
# サイト（LP / Publish 経路）には一切触れない。
name: DB Pipeline (Airtable)

on:
  schedule:
    # UTC 20:30 = JST 翌朝 5:30
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '実行する処理'
        required: true
        type: choice
        options: [apply, fix-dates, sync-site]
      mode:
        description: 'dry-run（確認のみ）か execute（書き込み）か'
        required: true
        type: choice
        options: [dry-run, execute]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: db-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run pipeline
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TASK="sync-site"
            FLAG="--execute"
          else
            TASK="${{ inputs.task }}"
            FLAG="--dry-run"
            if [ "${{ inputs.mode }}" = "execute" ]; then FLAG="--execute"; fi
          fi
          if [ "$TASK" = "sync-site" ]; then
            node scripts/db/export_site_festivals.mjs > /tmp/site-festivals.json
            python3 scripts/db/airtable_pipeline.py "$TASK" --input /tmp/site-festivals.json "$FLAG"
          else
            python3 scripts/db/airtable_pipeline.py "$TASK" "$FLAG"
          fi
