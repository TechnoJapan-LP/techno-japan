name: Weekly article draft

# 毎週月曜 09:00 JST に、直近14日のイベント/フェスをまとめた
# 「CMSに貼るだけ」の週間ガイド記事ドラフトを Issue として起票する。
on:
  schedule:
    - cron: '0 0 * * 1'   # 00:00 UTC = 09:00 JST Monday
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build weekly roundup draft from data.js
        run: |
          python3 - <<'PY'
          import json, re, datetime, pathlib

          src = pathlib.Path('LP/data.js').read_text(encoding='utf-8')

          def extract(name):
              m = re.search(rf'const {name} = \[(.*?)\n\];', src, re.DOTALL)
              return m.group(1) if m else ''

          def objects(block):
              """Split a JS array body into per-entry field dicts (regex-based, fits our data shape)."""
              entries = []
              depth, start = 0, None
              for i, ch in enumerate(block):
                  if ch == '{':
                      if depth == 0: start = i
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0 and start is not None:
                          entries.append(block[start:i+1])
                          start = None
              out = []
              for e in entries:
                  d = dict(re.findall(r'(\w+):\s*"([^"]*)"', e))
                  if d: out.append(d)
              return out

          today = datetime.date.today()
          horizon = today + datetime.timedelta(days=14)

          def parse_date(s):
              try: return datetime.date.fromisoformat(s.strip())
              except Exception: return None

          def fmt(d): return d.strftime('%-m/%-d (%a)')

          upcoming = []
          for ev in objects(extract('EVENTS')):
              d = parse_date(ev.get('date',''))
              if d and today <= d <= horizon:
                  upcoming.append(('EVENT', d, ev))
          for f in objects(extract('FESTIVALS')):
              raw = f.get('date','')
              start = parse_date(raw.split('/')[0]) if raw else None
              if start and today <= start <= horizon:
                  upcoming.append(('FESTIVAL', start, f))
          upcoming.sort(key=lambda x: x[1])

          wk = today.isocalendar()
          title = f"{today.strftime('%-m月%-d日')}週：日本のアンダーグラウンド・ダンスミュージック・ガイド"
          slug  = f"weekend-guide-{today.isoformat()}"

          if upcoming:
              items_html = []
              for kind, d, e in upcoming:
                  name  = e.get('name','(no name)')
                  venue = e.get('venue','')
                  city  = e.get('city') or e.get('location','')
                  where = ' / '.join(x for x in [venue, city] if x)
                  items_html.append(
                      f"<h3>{fmt(d)} — {name}</h3>\\n<p>{where}</p>\\n<p>（ここに一言コメントを書く）</p>")
              body_html = "<p>（導入文をここに書く：今週の見どころを2〜3文で）</p>\\n\\n" + "\\n\\n".join(items_html)
              listing = "\n".join(f"- {fmt(d)} **{e.get('name','')}** — {e.get('venue') or e.get('location','')} ({e.get('city','')}) [{kind}]" for kind, d, e in upcoming)
          else:
              body_html = "<p>（今週はdata.js上に該当イベントなし。手動で調べて追記するか、今週はスキップ）</p>"
              listing = "_data.js 内に該当するイベント/フェスなし_"

          issue_body = f"""## 今週の記事ドラフト（CMSに貼るだけ）

**対象期間**: {today.isoformat()} 〜 {horizon.isoformat()}

### 該当イベント
{listing}

---

### CMS入力値

| フィールド | 値 |
|---|---|
| ID | `{slug}` |
| Title | {title} |
| Category | `EVENTS` |
| Tags | `events, weekend-guide` |
| Status | `draft`（内容確認後に published へ） |
| Date | {today.isoformat()} |

### Body（HTML）

```html
{body_html}
```

---
_この Issue は weekly-article-draft workflow により自動生成。
本文の（）内を埋めて CMS → Article → New に貼り付け → Publish Now。_
"""
          pathlib.Path('issue_title.txt').write_text(f"📝 週間記事ドラフト: {title}", encoding='utf-8')
          pathlib.Path('issue_body.md').write_text(issue_body, encoding='utf-8')
          print(f"{len(upcoming)} upcoming items found")
          PY

      - name: Open draft issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$(cat issue_title.txt)" \
            --body-file issue_body.md \
            --label "article-draft" || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$(cat issue_title.txt)" \
            --body-file issue_body.md
