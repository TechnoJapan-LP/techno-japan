name: Sync Drive Images

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# scheduleとCMSからの手動実行が重なっても、Drive同期・git pushを並行させない。
concurrency:
  group: sync-drive-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      # Drive には CMS の「Image from URL」がフォールバックで保存した原寸 jpg/png/heic が
      # 溜まる（配信元が CORS を許可しないとブラウザ側で webp 化できない）。
      # サイトが配信するのは webp のみなので、ここで変換して救う。
      - name: Set up Pillow (webp / heic conversion)
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow pillow-heif

      - name: Sync images from Google Drive via GAS
        env:
          CMS_AUTH: ${{ secrets.CMS_AUTH_HASH }}
        run: |
          python3 << 'PYTHON'
          import urllib.request
          import urllib.parse
          import json
          import os
          import time     # 一時的な通信失敗の再試行に使う

          from PIL import Image, ImageOps
          import pillow_heif
          pillow_heif.register_heif_opener()   # iPhone 由来の .heic を Pillow で開けるようにする

          # 変換対象の原本拡張子。webp 以外はサイトが配信しないため、ここで webp を作る。
          SOURCE_EXTS = {'.jpg', '.jpeg', '.png', '.heic', '.heif'}
          MAX_EDGE = 1920          # CMS の compressImage と同じ長辺上限
          convert_failures = []

          GAS_URL = "https://script.google.com/macros/s/AKfycbxhJ6rtGoAirNyV5TtBvzWHNOT8RuB0nfDjwglmdu8ClhpWZ-OXSbMM4UyFE_7ZsV-Lpg/exec"
          PASS_HASH = os.environ.get('CMS_AUTH', '')

          # CMS はセッショントークン認証になったため、まず login でトークンを取得する。
          # （以前はパスワードハッシュを直接 cmsAuth に送っていたが、現在は必ず弾かれる）
          if not PASS_HASH:
              raise SystemExit("CMS_AUTH_HASH secret が未設定です")

          req = urllib.request.Request(
              GAS_URL,
              data=json.dumps({'action': 'login', 'passHash': PASS_HASH}).encode('utf-8'),
              method='POST',
          )
          with urllib.request.urlopen(req) as res:
              login = json.loads(res.read().decode('utf-8'))
          CMS_AUTH = login.get('token') if login.get('status') == 'ok' else None
          if not CMS_AUTH:
              raise SystemExit(
                  "ログイン失敗: " + str(login.get('message') or login) +
                  " — CMS_AUTH_HASH が現在のパスワードの SHA-256 と一致しているか確認してください"
              )
          print("Logged in: session token acquired")

          # 各フォルダタイプを同期
          FOLDERS = ["venues", "festivals", "artists", "articles"]
          failures = []

          for folder_type in FOLDERS:
              print(f"\n--- Syncing {folder_type} ---")
              # GAS は一時的に 404 や 5xx を返すことがある（2026-08-12 に実際に発生し、
              # articles の取得が 404 で落ちて同期全体が失敗した）。
              # 1回の失敗で諦めると、実体は何も壊れていないのに赤くなる。
              # 間隔を空けて数回試す。それでも駄目なら本当の失敗として扱う。
              qs = urllib.parse.urlencode({
                  'action': 'get_images',
                  'type': folder_type,
                  'cmsAuth': CMS_AUTH,
              })
              data = None
              last_err = None
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(f"{GAS_URL}?{qs}", timeout=60) as res:
                          data = json.loads(res.read().decode('utf-8'))
                      break
                  except Exception as e:
                      last_err = e
                      if attempt < 3:
                          wait = attempt * 10
                          print(f"  Fetch failed ({e}) — retrying in {wait}s [{attempt}/3]")
                          time.sleep(wait)
              if data is None:
                  print(f"Failed to fetch {folder_type} after 3 attempts: {last_err}")
                  failures.append(folder_type)
                  continue

              if data.get('status') != 'ok':
                  print(f"Error: {data.get('message')}")
                  failures.append(folder_type)
                  continue

              images = data.get('images', [])
              print(f"Found {len(images)} images in Drive/{folder_type}")

              os.makedirs(f'LP/images/{folder_type}', exist_ok=True)

              # Drive に webp があるものは、それが正（CMS がクライアント側で最適化した実物）。
              # 原本からの変換は「webp がまだ無いもの」の救済に限る。こうしないと
              # 既存の最適化済み webp を CI 変換版で毎回上書きし、無意味な差分が出続ける。
              webp_stems = {
                  os.path.splitext(i['name'])[0]
                  for i in images if i['name'].lower().endswith('.webp')
              }

              for img in images:
                  name = img['name']
                  if not name.lower().endswith('.webp'):
                      continue
                  file_path = f"LP/images/{folder_type}/{name}"
                  try:
                      urllib.request.urlretrieve(img['url'], file_path)
                      print(f"Downloaded: {name}")
                  except Exception as e:
                      print(f"Failed: {name} — {e}")
                      convert_failures.append(f"{folder_type}/{name} (download)")

              # ---- 原本 → webp 変換（webp が存在しないものだけ）----
              for img in images:
                  name = img['name']
                  stem, ext = os.path.splitext(name)
                  if ext.lower() not in SOURCE_EXTS:
                      continue
                  if stem in webp_stems:
                      print(f"Skipped (webp already in Drive): {name}")
                      continue
                  out_path = f"LP/images/{folder_type}/{stem}.webp"
                  if os.path.exists(out_path):
                      # 7/22 の一括最適化でコミット済みのものはそのまま使う（差分を出さない）
                      print(f"Skipped (webp already in repo): {name}")
                      continue
                  try:
                      tmp = f"/tmp/src{ext.lower()}"
                      urllib.request.urlretrieve(img['url'], tmp)
                      with Image.open(tmp) as im:
                          im = ImageOps.exif_transpose(im)
                          if im.mode not in ('RGB', 'RGBA'):
                              im = im.convert('RGB')
                          # CMS の compressImage と同条件（長辺1920px上限 / quality 0.85）
                          if max(im.size) > MAX_EDGE:
                              im.thumbnail((MAX_EDGE, MAX_EDGE), Image.LANCZOS)
                          im.save(out_path, 'WEBP', quality=85, method=6)
                      kb = os.path.getsize(out_path) / 1024
                      print(f"Converted: {name} -> {stem}.webp ({kb:.0f} KB, {im.size[0]}x{im.size[1]})")
                  except Exception as e:
                      print(f"Convert failed: {name} — {e}")
                      convert_failures.append(f"{folder_type}/{name}")

          # 握りつぶすと「成功」と表示されて故障に気づけないので、明示的に落とす。
          if failures:
              raise SystemExit(f"同期に失敗したフォルダ: {', '.join(failures)}")
          # 変換漏れは画像が出ないまま放置される。ジョブは通すが必ず見えるようにする。
          if convert_failures:
              print(f"\n::warning::webp 変換に失敗: {', '.join(convert_failures)}")
          print("\nSync complete.")
          PYTHON

      # 画像だけをコミットすると LP/image-dimensions.js が古いまま残り、
      # 次の deploy で regression-check が「生成物がコミット内容と一致しません」で
      # 落ちる。2026-08-06 に実際に起きた（AUDIT §9-45）。
      # 同期した側が寸法表も作り直して、同じコミットに含める。
      # build-image-dimensions.mjs は中身が変わったとき ?v も自動で上げる。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # カード用派生画像はDrive原本と分離した生成物。原本同期後に同じコミットへ含める。
      - name: Build festival card derivatives
        run: python3 scripts/build-image-derivatives.py

      - name: Regenerate image dimensions
        run: node scripts/build-image-dimensions.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LP/images/venues/ LP/images/festivals/ LP/images/artists/ LP/images/articles/
          git add LP/images/derivatives/ LP/image-derivatives.js
          # 寸法表と、?v を上げた HTML（LP/ と LP/en/ の両方に散る）。
          # 追跡済みの変更だけを拾うので、新しい画像は上の行が担当する。
          git add -u LP/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update images from Google Drive"
            # 押している間に他が push すると弾かれる。実際 2026-08-13 に、
            # 別の push と重なって同期が失敗した（画像は作れていたのに落ちた）。
            # rebase して数回やり直す。生成物の追加なので rebase で衝突しない。
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push が弾かれました。取り込んでやり直します [$i/3]"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 5))
            done
          fi
