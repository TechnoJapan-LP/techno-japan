name: Deploy LP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # main への直接 push も、公開前に regression-check.yml を必ず通す。
      - 'LP/**'
      - 'scripts/**'
      - '.github/regression-thresholds.yml'
      - '.github/workflows/regression-check.yml'
      - '.github/workflows/deploy-pages.yml'
      # CMS の Publish（LP/data.js 単独のコミット）はここでは扱わない。
      # data.js だけが新しく生成物が追従していない状態なので、
      # regression-check の「生成物がコミット内容と一致するか」に必ず落ちる。
      # その経路は publish-pipeline.yml が fetch → build → 検査 → deploy まで
      # 順序どおり面倒を見る。除外しないと同じ push で2本デプロイが走る。
      #
      # 否定パターンは「他に LP/ の変更があれば起動する」意味になる。
      # data.js 単独の push でだけ起動しない。人が data.js を手で直した場合も
      # 同じ扱いになるが、その内容は publish-pipeline が拾う。
      - '!LP/data.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/regression-check.yml

  deploy:
    needs: regression
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 開発中のコンパニオンアプリは本番に出さない（リポジトリ/ローカルには残す）。
      # 公開する準備ができたら、この step を削除するだけでデプロイ対象に戻る。
      - name: Exclude in-development app from deploy
        run: rm -rf ./LP/app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./LP

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
