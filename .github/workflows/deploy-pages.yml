name: Deploy LP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # main への直接 push も、公開前に regression-check.yml を必ず通す。
      - 'LP/**'
      - 'scripts/**'
      - '.github/regression-thresholds.yml'
      - '.github/workflows/regression-check.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 実行中のデプロイは最後まで終わらせる（途中で止めない）。
  #
  # 2026-08-07 まで true にしていたが、これが「デプロイが公開されない」事故を
  # 起こしていた。ファビコンのデプロイ実行中に別コミットが push され、
  # 動いていたデプロイを途中で kill → その別コミットが `cms: publish`
  # （下の if でスキップされる種類）だったため、結局何も公開されなかった。
  # 実行中を殺すと、後続がスキップ／GitHub側の一時障害で失敗したとき、
  # 良いデプロイまで一緒に失われる。AUDIT §9-50。
  #
  # false の実際の挙動（GitHub 仕様）:
  #   ・実行中の run は最後まで完走する（絶対に kill されない）
  #   ・push が重なると、新しい run が pending になり、
  #     それより前の pending は自動キャンセルされる
  #   → 「実行中1本 ＋ 最新の待機1本」だけが残り、最新は必ず後で公開される。
  #     連続 push でもデプロイが N 本積み上がらず、最新状態に必ず追いつく。
  cancel-in-progress: false

# CMS の Publish（`cms: publish data.js`）はこのワークフローでは扱わない。
# data.js だけが新しく生成物が追従していない状態なので、regression-check の
# 「生成物がコミット内容と一致するか」に必ず落ちる。その経路は
# publish-pipeline.yml が fetch → build → 検査 → deploy まで面倒を見る。
#
# 【paths の否定パターンは使わないこと】2026-08-04 に `- '!LP/data.js'` を
# 足したところ、**このワークフローが一切起動しなくなった**。他のパターンに
# 一致するファイル（.github/workflows/deploy-pages.yml 自身や LP/data/*.json）が
# 変わった push でも起動しない。ドキュメント上は「後続の否定に一致した
# パスだけ除外」だが、実際にはフィルタ全体が効かなくなった。
# サイトが更新されなくなる回帰なので、判定は job の if で行う。
# 経緯は AUDIT §9-39。
jobs:
  regression:
    if: "${{ !startsWith(github.event.head_commit.message, 'cms: publish') }}"
    uses: ./.github/workflows/regression-check.yml

  deploy:
    needs: regression
    if: "${{ !startsWith(github.event.head_commit.message, 'cms: publish') }}"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 開発中のコンパニオンアプリは本番に出さない（リポジトリ/ローカルには残す）。
      # 公開する準備ができたら、この step を削除するだけでデプロイ対象に戻る。
      - name: Exclude in-development app from deploy
        run: rm -rf ./LP/app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./LP

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
