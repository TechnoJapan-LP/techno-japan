name: Deploy LP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # main への直接 push も、公開前に regression-check.yml を必ず通す。
      - 'LP/**'
      - 'scripts/**'
      - '.github/regression-thresholds.yml'
      - '.github/workflows/regression-check.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  # 再生成した LP を同じデプロイでコミットし、次回の生成差分を残さない。
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 実行中のデプロイは最後まで終わらせる（途中で止めない）。
  #
  # 2026-08-07 まで true にしていたが、これが「デプロイが公開されない」事故を
  # 起こしていた。ファビコンのデプロイ実行中に別コミットが push され、
  # 動いていたデプロイを途中で kill → その別コミットが `cms: publish`
  # （下の if でスキップされる種類）だったため、結局何も公開されなかった。
  # 実行中を殺すと、後続がスキップ／GitHub側の一時障害で失敗したとき、
  # 良いデプロイまで一緒に失われる。AUDIT §9-50。
  #
  # false の実際の挙動（GitHub 仕様）:
  #   ・実行中の run は最後まで完走する（絶対に kill されない）
  #   ・push が重なると、新しい run が pending になり、
  #     それより前の pending は自動キャンセルされる
  #   → 「実行中1本 ＋ 最新の待機1本」だけが残り、最新は必ず後で公開される。
  #     連続 push でもデプロイが N 本積み上がらず、最新状態に必ず追いつく。
  cancel-in-progress: false

# CMS の Publish（`cms: publish data.js`）はこのワークフローでは扱わない。
# data.js だけが新しく生成物が追従していない状態なので、regression-check の
# 「生成物がコミット内容と一致するか」に必ず落ちる。その経路は
# publish-pipeline.yml が fetch → build → 検査 → deploy まで面倒を見る。
#
# 【paths の否定パターンは使わないこと】2026-08-04 に `- '!LP/data.js'` を
# 足したところ、**このワークフローが一切起動しなくなった**。他のパターンに
# 一致するファイル（.github/workflows/deploy-pages.yml 自身や LP/data/*.json）が
# 変わった push でも起動しない。ドキュメント上は「後続の否定に一致した
# パスだけ除外」だが、実際にはフィルタ全体が効かなくなった。
# サイトが更新されなくなる回帰なので、判定は job の if で行う。
# 経緯は AUDIT §9-39。
jobs:
  regression:
    if: "${{ !startsWith(github.event.head_commit.message, 'cms: publish') }}"
    uses: ./.github/workflows/regression-check.yml
    with:
      # main のデプロイは生成差分を後続の deploy ジョブで解消する。
      # PR の回帰検査は既定値 true のまま厳格にする。
      fail_on_generated_drift: false

  deploy:
    needs: regression
    if: "${{ !startsWith(github.event.head_commit.message, 'cms: publish') }}"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 回帰検査と同じ生成をデプロイ直前にも行う。ここで作られた LP が
      # 実際に Pages へ配信されるため、コミット漏れで古い生成物を出さない。
      - name: Build detail pages for deployment
        run: node scripts/build-detail-pages.mjs

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A LP/
          if git diff --cached --quiet; then
            echo "生成物に変更なし"
          else
            git commit -m "chore: sync generated LP before deploy [skip ci]"
            # 同時 push があっても、Pages の配信自体は止めない。
            # 次回の push または日次生成で再同期される。
            git push || echo "::warning::生成物コミットのpushに失敗しました。配信は続行します。"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 開発中のコンパニオンアプリは本番に出さない（リポジトリ/ローカルには残す）。
      # 公開する準備ができたら、この step を削除するだけでデプロイ対象に戻る。
      - name: Exclude in-development app from deploy
        run: rm -rf ./LP/app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./LP

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Actions の workflow_run は、手動起動した Deploy では
      # Lighthouse を後続起動しないことがある。手動で本番確認した場合も
      # 検査漏れにしないため、手動Deployの完了後だけ明示的に起動する。
      - name: Trigger Lighthouse after manual deploy
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lighthouse.yml --ref "${GITHUB_SHA}"
