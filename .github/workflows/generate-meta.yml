name: Generate sitemap.xml & rss.xml

on:
  push:
    branches: [main]
    paths:
      - 'LP/data.js'
      - 'scripts/generate-sitemap.py'
      - 'scripts/generate-rss.py'
      - '.github/workflows/generate-meta.yml'
  schedule:
    # Run daily at 03:00 UTC (12:00 JST)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # data.js から実URLの詳細ページを生成する。これを作らないと
      # sitemap が指すURLが 404 になるので、sitemap 生成より前に実行する。
      - name: Build detail pages
        run: node scripts/build-detail-pages.mjs

      - name: Generate sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Generate rss.xml
        run: python3 scripts/generate-rss.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A LP/sitemap.xml LP/rss.xml LP/articles LP/festivals LP/artists LP/venues LP/en
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: regenerate detail pages, sitemap.xml & rss.xml [skip ci]"
            git push
          fi
