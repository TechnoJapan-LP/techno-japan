name: Generate sitemap.xml & rss.xml

# 2026-08-04: push トリガーを廃止した。
#
# LP/data.js の push で起動していたが、同じ push で deploy-pages.yml も走り、
# こちらが再生成して [skip ci] でコミットする頃には deploy 側は
# 「生成物が古い」で落ちていた。正しくなった生成物はデプロイされないまま残る。
# Publish の経路は publish-pipeline.yml が一本道で処理する。
#
# ここは保険として日次実行だけを残す。シート側だけが変わって Publish が
# 走らなかった場合（手編集・外部からの更新）に sitemap を追従させる。
on:
  schedule:
    # Run daily at 03:00 UTC (12:00 JST)
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: generate-meta
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # data.js から実URLの詳細ページを生成する。これを作らないと
      # sitemap が指すURLが 404 になるので、sitemap 生成より前に実行する。
      - name: Build detail pages
        run: node scripts/build-detail-pages.mjs

      # 定期実行でも publish-pipeline と同じ整合性検査を通す。
      # ここを素通りさせると、壊れたデータのまま sitemap だけが更新され、
      # 存在しないURLを載せた sitemap を配ることになる。
      # Chrome を要する描画検査（check_hub_pages）はここでは省く。
      # 生成物をコミットするだけでデプロイはしないため、実行時の JS 健全性は
      # 次の deploy 経路で必ず見られる。
      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Check service worker routing
        run: node scripts/check_sw_routing.mjs

      - name: Check regression thresholds
        run: python3 scripts/check_regressions.py

      - name: Generate sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Generate rss.xml
        run: python3 scripts/generate-rss.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # LP/ 配下をまとめて拾う。deploy-pages.yml / publish-pipeline.yml と同じ。
          #
          # かつて「LP/articles LP/festivals LP/artists LP/venues LP/en」と
          # 列挙していたが、LP/festivals は**フォルダ**なので LP/festivals.html
          # には当たらない。一方 EN は LP/en でフォルダごと入るため、
          # **EN のハブだけ更新され、JA のハブが取り残されていた。**
          # 実際に LOA の記事が JA の news.html の静的リンク一覧から漏れ、
          # JS を実行しないクローラーには新着記事が見えていなかった（§9-64）。
          #
          # 列挙は「生成物が増えたときに足し忘れる」形。足し忘れても誰も気づかない。
          # 列挙をやめる。
          git add -A LP/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: regenerate detail pages, sitemap.xml & rss.xml [skip ci]"
            git push
          fi
