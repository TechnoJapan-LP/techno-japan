name: Generate sitemap.xml & rss.xml

on:
  push:
    branches: [main]
    paths:
      - 'LP/data.js'
      - 'scripts/generate-sitemap.py'
      - 'scripts/generate-rss.py'
      - '.github/workflows/generate-meta.yml'
  schedule:
    # Run daily at 03:00 UTC (12:00 JST)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate sitemap.xml
        run: python3 scripts/generate-sitemap.py

      - name: Generate rss.xml
        run: python3 scripts/generate-rss.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet LP/sitemap.xml LP/rss.xml; then
            echo "No changes to sitemap.xml or rss.xml"
          else
            git add LP/sitemap.xml LP/rss.xml
            git commit -m "chore: regenerate sitemap.xml & rss.xml [skip ci]"
            git push
          fi
