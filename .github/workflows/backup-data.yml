name: Backup Spreadsheet Data

on:
  schedule:
    - cron: '0 2 * * *'  # 毎日 11:00 JST (02:00 UTC)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Backup data from Google Sheets via GAS
        run: |
          python3 << 'PYTHON'
          import urllib.request
          import json
          import os
          from datetime import datetime, timezone, timedelta

          GAS_URL = "https://script.google.com/macros/s/AKfycbxhJ6rtGoAirNyV5TtBvzWHNOT8RuB0nfDjwglmdu8ClhpWZ-OXSbMM4UyFE_7ZsV-Lpg/exec"
          PASS_HASH = os.environ.get('CMS_AUTH_HASH', '')

          # 認証はセッショントークン方式（パスワードハッシュ直渡しは2026-07の
          # 認証刷新で無効になり、以降のバックアップが全て空で保存されていた）
          if not PASS_HASH:
              raise SystemExit("CMS_AUTH_HASH secret が未設定です")
          req = urllib.request.Request(
              GAS_URL,
              data=json.dumps({'action': 'login', 'passHash': PASS_HASH}).encode('utf-8'),
              method='POST',
          )
          with urllib.request.urlopen(req) as res:
              login = json.loads(res.read().decode('utf-8'))
          AUTH = login.get('token') if login.get('status') == 'ok' else None
          if not AUTH:
              raise SystemExit("ログイン失敗: " + str(login.get('message') or login))
          print("Logged in: session token acquired")

          # 【シートを新設したらここに必ず追加すること】
          # 2026-08-05 まで EDITIONS / LINEUPS が漏れており、開催回と
          # ラインナップ284行が一度もバックアップされていなかった（AUDIT §9-41）。
          # ハードコードなので、シートを増やしても自動では入らない。
          # 追加を忘れても既存シートのバックアップは成功し続けるため、
          # 失敗として現れない。気づく手段が無い種類の漏れである。
          SHEETS = ['VENUES', 'FESTIVALS', 'ARTISTS', 'EVENTS', 'ARTICLES',
                    'EDITIONS', 'LINEUPS']
          backup = {'_meta': {'backedUpAt': datetime.now(timezone(timedelta(hours=9))).isoformat()}}
          failures = []

          for sheet in SHEETS:
              url = f"{GAS_URL}?action=get_sheet&sheet={sheet}&cmsAuth={AUTH}"
              try:
                  with urllib.request.urlopen(url) as res:
                      data = json.loads(res.read().decode('utf-8'))
                  if data.get('status') == 'ok':
                      backup[sheet] = data.get('rows', [])
                      print(f"✓ {sheet}: {len(backup[sheet])} rows")
                  else:
                      print(f"✗ {sheet}: {data.get('message','unknown error')}")
                      failures.append(sheet)
              except Exception as e:
                  print(f"✗ {sheet}: {e}")
                  failures.append(sheet)

          # 取得失敗があれば「空のバックアップ」を保存せず明示的に失敗させる
          # （空を成功として保存すると、正常な過去バックアップを30日で押し流してしまう）
          if failures:
              raise SystemExit(f"バックアップ失敗: {', '.join(failures)}")
          if all(len(backup[s]) == 0 for s in SHEETS):
              raise SystemExit("全シートが0行 — シート/GAS障害の可能性があるため保存しません")

          os.makedirs('backups', exist_ok=True)
          # 最新 + 日付付き
          today = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d')
          with open('backups/latest.json', 'w', encoding='utf-8') as f:
              json.dump(backup, f, ensure_ascii=False, indent=2)
          with open(f'backups/{today}.json', 'w', encoding='utf-8') as f:
              json.dump(backup, f, ensure_ascii=False, indent=2)

          # 30日より古いバックアップを削除
          import glob
          from datetime import date
          for path in glob.glob('backups/*.json'):
              if path.endswith('latest.json'): continue
              try:
                  fname = os.path.basename(path).replace('.json','')
                  fdate = datetime.strptime(fname, '%Y-%m-%d').date()
                  if (date.today() - fdate).days > 30:
                      os.remove(path)
                      print(f"Removed old backup: {fname}")
              except: pass

          print(f"\nBackup complete: {today}")
          PYTHON
        env:
          CMS_AUTH_HASH: ${{ secrets.CMS_AUTH_HASH }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "backup: spreadsheet data $(date -u +%Y-%m-%d)"
            git push
          fi
