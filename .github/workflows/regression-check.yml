name: Regression Check

# 生成物の回帰を PR 時点で止める。
#
# 背景: 948a440 で Festival.performer 約130件・LINE UP 10ページ・
# 出演フェス 94ページが気づかれずに本番へデプロイされた。ローカルの diff で
# 検出可能だったが実行されなかった。人手の手順に依存しないための関門。
#
# このワークフローは検査のみで、生成物をコミットしない。
# PR では単独実行し、main push では deploy-pages.yml から公開前ゲートとして呼ばれる。

on:
  # deploy-pages.yml から必須の公開前ゲートとして呼び出す。
  workflow_call:
  pull_request:
    paths:
      # 公開物・生成器・検査コードのどこを触っても同じゲートを通す。
      # 個別列挙は新しいアセットを追加した時に漏れるため、ディレクトリ単位にする。
      - 'LP/**'
      - 'scripts/**'
      - '.github/regression-thresholds.yml'
      - '.github/workflows/regression-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # merge-base を取るため全履歴が要る

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Install Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      # 生成物はリポジトリにコミットされているが、PR の変更が生成側だけの場合に
      # 古い生成物のまま検査してしまう。必ず作り直してから測る。
      - name: Build detail pages
        run: node scripts/build-detail-pages.mjs

      # 生成側を変えたのに生成物を再生成せずコミットしていないか検出する。
      # ここが差分ありなら、PR の生成物は本番に出る内容と一致しない。
      - name: Fail if generated pages are stale
        run: |
          if ! git diff --quiet -- LP/; then
            echo "::error::LP/ の生成物がコミット内容と一致しません（$(git diff --name-only -- LP/ | wc -l) ファイル）。生成側を変更したなら再生成してコミットしてください。"
            git diff --stat -- LP/ | tail -5
            exit 1
          else
            echo "生成物はコミット内容と一致しています。"
          fi

      # JS/CSS を変えたのに ?v を据え置くと、sw.js の cache-first により
      # 一度取得したブラウザへ永久に届かない。cms.js は実際に 26回分が
      # 届いていなかった（AUDIT §9-11）。生成物ではなくソースの検査なので
      # ビルドの前後どちらでもよいが、失敗を早く出すためここに置く。
      - name: Check asset cache busting
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            compare="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -Eq '^0+$'; then
            compare="$BEFORE_SHA"
          else
            compare="HEAD^"
          fi
          echo "Asset comparison base: $compare"
          python3 scripts/check_asset_versions.py --base "$compare"

      # sw.js の分岐順。data.js が cache-first に吸われると Publish しても
      # 一度訪問したブラウザには反映されない（AUDIT §9-18）。
      - name: Check service worker routing
        run: node scripts/check_sw_routing.mjs

      - name: Check regression thresholds
        run: python3 scripts/check_regressions.py

      # 404 にならないリンク切れ（廃止済み SPA ハッシュ）を含む内部リンク検査。
      # トップ・検索・お気に入りから詳細へ行けない状態が4日続いた（AUDIT §9-44）。
      - name: Check internal links
        run: python3 scripts/check_internal_links.py

      # CMS は prompt() でブラウザ検査ができないので、cms.js を VM に読んで
      # 開催回まわりの回帰を見る（AUDIT §9-47）。
      - name: Check CMS editions logic
        run: node scripts/check_cms_editions.mjs

      - name: Check card image derivatives
        run: python3 scripts/check_image_derivatives.py

      # 生成物の静的検査では「JS は配信されているが実行時に死ぬ」障害を検出できない。
      # 実際に headless Chrome で開いて、Uncaught 例外と描画結果を確認する。
      - name: Verify Chrome is available
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else echo "::error::headless Chrome が見つかりません"; exit 1; fi

      - name: Check hub pages render (JS health)
        # フェス一覧は画像遅延読み込みを含むため、CIのChromeが混雑すると
        # 既定9秒では描画途中を検査してしまう。失敗を隠さず、描画待ちだけ延長する。
        run: python3 scripts/check_hub_pages.py --budget 15000

      # 生成物は絶対にコミットしない（検査専用ジョブ）。
      # 明示的に捨てて、後続ステップが誤って拾わないようにする。
      - name: Discard generated output
        if: always()
        run: git checkout -- LP/ || true
