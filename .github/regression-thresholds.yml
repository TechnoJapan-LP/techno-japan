      新規3件の追加と、B2B 2件（antal-hunee / sisi-b2b-ouissam-b2b-yamarchy）の
      削除が同時に入った結果。リダイレクトスタブは @id を持たないので数に入らない。

  # 2026-08-01 に追加された FAQ と要約文（f19e831 / e763cbf）。
  # 監査 C1「FAQPage がサイト全体で 0件」と C-2（自然言語の質問を見出しに）への対応。
  festival_faq_pages:
    description: JSON-LD に FAQPage を持つフェスページ数（JA + EN）
    min: 172
    target: 172
    note: 全86フェス × JA/EN。全件が対象なので min == target。

  festival_faq_section_pages:
    description: <section class="festival-faq"> を持つフェスページ数（JA + EN）
    min: 172
    target: 172
    note: >-
      スキーマ(festival_faq_pages)と可視HTMLの両方を見る。片方だけ壊れる
      ことがあるため別メトリクスにしている。構造化データだけあって画面に
      出ていない状態は Google のガイドライン違反にもなる。

  festival_faq_qa_total:
    description: FAQPage の mainEntity（Q&A）の総数（JA + EN 合算）
    min: 376
    target: null              # 設問はデータの充実度で増えるため固定目標を置かない
    note: >-
      ページ数だけだと 1ページの設問が 4問 → 1問に減っても検出できないので
      総数を持つ。2026-08-01 実測 376（JA 188 + EN 188）。
      1ページあたりの内訳は 1問:1ページ / 2問:74 / 3問:5 / 4問:6（各言語）。
      min を片言語分の 188 にすると EN の全設問が消えても通ってしまうため、
      合算値を基準にする。設問数は DATE・会場・チケットURL 等の有無で
      決まるので、データが欠けると静かに減る。減ったら回帰。

  festival_summary_pages:
    description: <p class="festival-summary"> を持つフェスページ数（JA + EN）
    min: 172
    target: 172
    note: >-
      指示書 Phase C-1（結論ファースト / BLUF）に対応する要約文。
      全86フェス × JA/EN。

  festival_official_link_pages:
    description: OFFICIAL SITE リンクを持つフェスページ数（JA + EN）
    min: 26
    target: null              # FESTIVALS.URL の入力件数に比例するため固定目標を置かない
    note: >-
      2026-08-02 実測 26（13フェス × JA/EN）。B-3 対応時に公式サイト導線が
      消失した回帰を再発させないためのラチェット。URL データが増えれば増加し、
      減った場合は生成ロジックまたは入力データの回帰として停止する。

  festival_social_link_pages:
    description: SNSリンクを持つフェスページ数（JA + EN）
    min: 34
    target: null              # FESTIVALS.INSTAGRAM 等の入力件数に比例するため固定目標を置かない
    note: >-
      2026-08-02 実測 34（Instagram 17フェス × JA/EN）。SNSリンク群の
      マークアップが生成ページから消える回帰を検出する。将来 X / SoundCloud を
      追加しても、SNSリンクを1件以上持つページ数として継続計測する。

  submit_link_pages:
    description: 掲載申請ページ（submit.html）へのリンクを持つページ数
    min: 426
    target: null              # 詳細ページの増減に比例するため固定目標を置かない
    note: >-
      2026-08-01 に submit.html を公開。全ページのフッターから導線を張っている。
      リンクが無い21ページはすべて noindex かリダイレクトスタブで意図どおり
      （404 / cms / map / 旧IDスタブ14件 等）。
      テンプレート変更でフッターの導線が静かに消えるのを防ぐ。
      詳細ページが増えれば増えるので、減ったら回帰。

  en_hub_leaks_to_ja:
    description: EN ハブから JA 詳細ページへ漏れているリンクの数
    min: 0
    max: 0                    # 増加方向が回帰
    target: 0
    note: >-
      EN ハブは JA ハブから機械生成する（enHubFromJa）。置換漏れがあると
      英語ユーザーが日本語ページへ飛ばされる。実装時に実際に踏んだ:
      静的リンク・data.js の読み込みパス・index.html の相対表記の3箇所。
      生成物を検査して 0 を維持する。
      【守備範囲】見ているのは「リンク先の URL」だけで、文言が英語かどうかは
      見ていない。名前から EN ハブの日本語漏れ全般を守っていると読めてしまうが、
      文言のうち静的な分は en_hub_jsonld_ja_chars /
      en_hub_static_links_ja_chars が分担する。
      JS が data.js から描く本文（f.desc 等）はここでは見ておらず、
      実行しないと見えないので check_hub_pages.py の max_ja_chars が担当する。
      このメトリクスが緑でも本文が日本語のままでありうる。実際そうだった:
      2026-08-03 に EN Festivals の描画後コンテナに日本語が 11,196 字あったが、
      その間もこのメトリクスは 0 のまま緑だった。

  en_hub_jsonld_ja_chars:
    description: EN ハブの JSON-LD に残る日本語の文字数（alternateName を除く）
    min: 0
    max: 0                    # 増加方向が回帰
    target: 0
    note: >-
      2026-08-03 の調査で発覚。enHubFromJa の EN_HUB_DESC 置換は
      name="description" / og:description / twitter:description の3つしか
      対象にしておらず、JSON-LD の "description" が素通りしていた。
      EN ハブ4枚（festivals/artists/venues/news）が日本語併記のままだった。
      同日 replaceCollectionPageDesc() を追加して 126 → 0 になったので有効化。
      置換対象は CollectionPage.description だけ。index.html の
      WebSite.description は「サイト全体の説明」なのでページ説明で
      上書きしない（元から英語で日本語の混入も無い）。
      【alternateName を除外する理由】en/index.html の
      "alternateName": "テクノジャパン" は英語ページでも正しい構造化データで、
      これを含めて 0 を目指すと正しい値を消す方向に圧力がかかる。
      将来 JA 名を持つ別キーが必要になったら JSONLD_JA_ALLOWED_KEYS に
      理由つきで足す。判定は生ブロックの正規表現ではなくパース済み
      オブジェクトを辿る（キー単位で扱いを変えるため）。

  en_hub_static_links_ja_chars:
    description: EN ハブの STATIC_LINKS ブロックに残る日本語の文字数
    min: null
    max: 66                   # 2026-08-03 実測（216 → 66）。増加方向のみ回帰
    target: null              # 0 は達成不能。下記のとおり固有名詞が日本語のため
    note: >-
      静的リンク一覧は writeHubLinks が JA ハブへ書き込み、EN 側は
      enHubFromJa が EN_HUB_LINKS のラベルへ差し替える。
      当初は URL だけ書き換えたコピーで、ラベルが JA のままだった（216）。
      festivalHubLabel に lang を通して 66 へ。editionPlace はもともと
      lang を受け取れたのに 'ja' 固定で呼ばれていた。
      【0 にできない理由】残り66字の内訳:
      日本語名のフェス5件 24字（森、道、市場 / 円相芸術音楽祭 / 御月民 -OTSUKIMI- /
      SPRING LOVE 春風 / CAPSULE-山中湖花火音楽祭）、記事タイトル 27字、
      アーティスト「青」1字 — いずれも name_en / title_en 未入力。
      name_en は入力しない方針（2026-08-03 判断。名前はほぼ英字表記が実態）。
      残る14字は rainbow-disco-club-2026 の EDITIONS 行で LOCATION と
      LOCATION_JA が入れ替わっているデータ誤り（報告済み・未修正）。
      直れば 52 になるので、そのとき実測値へ引き下げる。
      したがって目標は 0 ではなく「増やさないこと」。

  hub_language_toggles:
    description: 言語トグルが正しく相手言語へリンクしているハブ数（JA 6 + EN 6）
    min: 12
    target: null              # ハブが増えれば増える
    note: >-
      「存在するか」ではなく「相手言語の正しいURLへリンクしているか」まで見る。
      JA→/en/xxx.html、EN→/xxx.html。片方向だけ壊れる事故を検出するため。
      判定に正規表現を使わない: nav-lang の中身は JA/EN で非対称
      （JA は </a></span>、EN は </span></span> で終わる）ため、
      `<span class="nav-lang">(.*?)</span></span>` と書くと JA 側だけ
      マッチせず誤検出する。実際に一度「トグルが無い」と誤報告した。
      生成側が出す固定文字列をそのまま探す。

  hreflang_hub_pages:
    description: hreflang を持つハブページ数（JA 5 + EN 5 = index/festivals/artists/venues/news/about）
    min: 12
    target: null              # ハブが増えれば増える
    note: >-
      2026-08-02 まで JA ハブ8枚に hreflang が1本も無かった。
      JA/EN を相互に張り、x-default は EN（詳細ページの既存規則に合わせる）。

  broken_image_refs:
    description: 生成HTMLが参照する /images/ で実体が存在しないものの件数
    min: 0
    max: 0                    # 増加方向が回帰なので max で判定する
    target: 0
    note: >-
      監査 B4 で 8件 → 0件に解消済み。<img> だけでなく og:image /
      twitter:image / JSON-LD image も対象。

  lineup_linked_acts:
    description: LINEUP のうちアーティスト詳細へリンクされている件数
    min: 115                  # 2026-08-03 実測。減る方向のみ検出する
    max: null
    target: null
    note: >-
      当初は逆に lineup_unresolved_acts（未解決の件数）を上限つきで見ていたが、
      「Techno Japan として扱いたいアーティストのみ登録する」方針が決まり、
      未登録は欠落ではなく編集判断になったため意味を反転した。
      守りたいのは「いま張れているリンクが壊れて減らないこと」で、
      ID の付け替えやアーティスト削除で既存のリンクが切れたら検出する。
      2026-08-03 に 115 で確定（ARTISTS 整理と13名の登録を反映）。
      75（ID修正前）→ 100（ID修正）→ 115（NAME修正・LINEUP書換・13名登録）と推移。
      アーティストを draft にすると当然減るので、その際は実測値へ引き下げる。
      詳細は AUDIT_TECHNO_JAPAN.md §9-25。

  artist_id_violations:
    description: DATA_SCHEMA §1.1 の slug 規約に反するアーティストIDの件数
    min: 0
    max: 0                    # 増加方向が回帰。7件の是正完了により 0 へ引き下げ済み
    target: 0
    note: >-
      2026-08-01 に 7件 → 0件。一括登録時に ID 欄へ NAME をそのまま貼った
      （大文字・スペース入りで URL に %20 が出ていた）分をスラッグへ是正し、
      旧URLは REDIRECTS のスタブで維持している。
      計測はリダイレクトスタブを除外する（スタブは旧ID名のファイルとして
      意図的に残るため、除外しないと永久に 0 にならない）。
      検査を生成物のファイル名で行う理由: fetch-data.mjs は ID を検証して
      exit(1) するが、詳細ページの元になる data.js は CMS の Publish Now(GAS)
      が生成する別経路で、その検証を通らない。ここが実質唯一の自動関門。

# ハブページの JS 健全性（scripts/check_hub_pages.py）
#
# 生成物の静的検査では「JS は配信されているが実行時に死ぬ」障害を検出できない。
# 2026-07-22 から 10日間 festivals.html の一覧が表示されていなかった事故
# （data.js の DATE 欠落 → getYearFromDate が undefined.split() で例外 →
# ページ全体の JS 停止）を受けて追加した。
#
# marker には「JS だけが生成するクラス名」を指定する。静的リンクの
# フォールバックが残っていても描画失敗を検出できるようにするため。
# min_markers は実測値から余裕を持たせた値（データ件数の増減で多少ぶれる）。
#
# ja_containers / max_ja_chars（EN ハブのみ）:
#   描画後のデータ描画コンテナに残る日本語の文字数を見る。EN ハブの静的 HTML は
#   ほぼ空で、日本語は data.js から JS が描くため、静的検査では捕まえられない
#   （2026-08-03 時点で EN Festivals に 11,196 字あったが、生成物を見る
#   en_hub_leaks_to_ja は 0 のまま緑だった）。
#
#   <main> を使わずコンテナ id を列挙するのは、news.html と index.html が
#   <main> を持たないため。「見つからなければ <main> や body へ」という
#   フォールバックを置くと、id を間違えたときにナビやフッターまで数えて
#   別の値にすり替わる（実際に一度そう誤報した）。見つからなければ FAIL にする。
#
#   max_ja_chars を 0 にできないページがある。フェス名・記事タイトルに
#   日本語の固有名詞があり、name_en / title_en は入力しない方針のため。
#   目標は 0 ではなく「増やさないこと」。--update は min_markers しか
#   書き換えないので、この値は意図的に更新すること。
hub_pages:
  festivals.html:
    container: festivals-main
    marker: festival-layout        # フェスカード。JS の renderFestivals が生成
    min_markers: 50                # 実測 70（86件中、表示対象のフェスカード）
    min_container_bytes: 60000     # 実測 112,911。JS 停止時は 9,130 まで落ちた
  artists.html:
    marker: artist-card
    min_markers: 70                # 実測 101
    min_container_bytes: 40000     # 実測 66,260
  venues.html:
    marker: venue-card
    min_markers: 18                # 実測 23
    min_container_bytes: 10000     # 実測 17,101
  news.html:
    marker: feed-card              # news は <main> を使わず別コンテナへ描画する
    min_markers: 1                 # 実測 1（ARTICLES が1件のみのため）
    min_container_bytes: 0         # <main> は空が正常
  # submit は静的ページで JS 描画を持たない。marker は静的セクションを数えるので
  # 「JS が描画したか」ではなく「ページが正しく配信され本文が存在するか」の検査になる。
  # Uncaught 例外の検出は他ページと同じく有効。
  submit.html:
    container: main-content
    marker: submit-section
    min_markers: 3                 # 実測 3
    min_container_bytes: 800       # 実測 1,100
  en/submit.html:
    container: main-content
    marker: submit-section
    min_markers: 3                 # 実測 3
    min_container_bytes: 800       # 実測 1,640
  # EN ハブ（build-detail-pages.mjs が JA から機械生成する）。
  # marker と閾値は JA と同じでよい。同じ data.js を読むのでカード数も一致する。
  en/festivals.html:
    container: festivals-main
    marker: festival-layout
    ja_containers: [festivals-main]
    max_ja_chars: 35    # 2026-08-03 実測。日本語名のフェス5件 21字 + rainbow-disco-club の LOCATION 空欄による location_ja フォールバック 14字。11,196 → 35
    min_markers: 50                # 実測 71
    min_container_bytes: 60000
  en/artists.html:
    marker: artist-card
    ja_containers: [artists-grid]
    max_ja_chars: 1    # 2026-08-03 実測。アーティスト「青」の1字。name_en は入力しない方針
    min_markers: 70                # 実測 101
    min_container_bytes: 40000
  en/venues.html:
    marker: venue-card
    ja_containers: [venues-grid]
    max_ja_chars: 0    # 2026-08-03 実測。0 を維持する。venue の desc_en は22/22そろっている
    min_markers: 18                # 実測 23
    min_container_bytes: 10000
  en/news.html:
    marker: feed-card
    ja_containers: [featured-col, side-col, feed-grid]
    max_ja_chars: 27    # 2026-08-03 実測。記事タイトル27字。title_en が未入力（CMS の ENGLISH VERSION）
    min_markers: 1                 # 実測 1
    min_container_bytes: 0
  en/index.html:
    ja_containers: [stories-grid, festivals-preview, artists-track, venues-preview]
    max_ja_chars: 39    # 2026-08-03 実測。記事タイトル27字 + フェス名12字。title_en / name_en 未入力
    # TOP は他ハブと構成が違い、<main> もカード用の共通クラスも持たない。
    # 静的に必ず存在するセクション見出し(.section-head)を存在確認に使う。
    marker: section-head
    min_markers: 4                 # 実測 4（NEWS / FESTIVALS / ARTISTS / VENUES）
    min_container_bytes: 0
