# 生成物の回帰ガード — 閾値定義
#
# 目的:
#   build-detail-pages.mjs の改修で、構造化データや内部リンクが
#   気づかれずに消えるのを防ぐ。「ページ数は増えても減らない」という
#   単調性だけを検査する（増加は常に許可、減少は fail）。
#
# 経緯:
#   948a440「Implement festival edition history and entity IDs」で
#   旧 f.lineup からの出力を廃止した際、lineups.json からの再実装が
#   未着手のまま本番へデプロイされ、以下が失われた。
#     - Festival.performer  約130件（10フェス分）
#     - <h2>LINE UP</h2>    10ページ
#     - <h2>出演フェス</h2>  94ページ
#   ローカルの diff で検出可能だったが、実行されずに push された。
#   このファイルは同種の事故を機械的に止めるための基準値。
#
# 運用:
#   min の値を下回ったら fail。意図的な減少なら min を更新してコミットし、
#   理由を note に書く（サイレントな引き下げを避けるため必須）。
#   target は「データ整備で到達すべき目標」で、CI の合否には使わない。
#
# ステータス: 【確定済み — 2026-08-01】
#   min は lineups.json 実装完了時(91491eb)の実測値。
#   回帰前(334bd19)の値は基準にしない。lineups.json の現データでは復旧上限が
#   旧実装を下回るため、達成不可能な閾値になり CI が恒久的に赤くなる。
#   到達すべき値は target に分けて記録している。

version: 1
baseline_commit: e763cbf   # Regenerate festival pages with FAQ and refreshed data
baseline_measured_at: 2026-08-01

metrics:
  festival_performer_pages:
    description: JSON-LD の Festival.performer を1件以上持つフェスページ数（JA）
    min: 9
    target: 10                # 【本来の目標値】旧実装で LINE UP が出ていたフェス数
    note: >-
      2026-08-01: data/*.json を再生成して 8 → 9。ID是正により
      festival-de-frue の出演者が解決され performer が付いた。
      target(10) との差 1件は osukinidouzo（lineups.json に行が無い）。
      内訳: 99flags, ala, arch, festival-de-frue, matricaria, paramount,
      rainbow-disco-club, transcendence, waifu

  festival_performer_total:
    description: Festival.performer の総件数（JA、全フェス合計）
    min: 75
    target: null              # ARTIST_ID の解決状況に依存するため固定目標を置かない
    note: >-
      2026-08-01: 68 → 75。lineups.json 130行のうち ARTIST_ID が解決済みの
      75行に対応する。残りは ACT_LABEL のみで performer に出さない
      （複合枠5件 + ARTISTS 未登録の単独枠）。
      ARTISTS への登録を進めれば増える。減ったら回帰。

  lineup_section_pages:
    description: <h2>LINE UP</h2> セクションを持つフェスページ数（JA）
    min: 10
    target: 10                # 【本来の目標値】旧実装と同じ 10フェス
    note: >-
      2026-08-01: 9 → 10 で target に到達。ACT_LABEL のみの行でも見出しは
      出るため performer(9) より 1件多く、差の1件は the-star-festival
      （全行 ARTIST_ID 未解決）。osukinidouzo は依然 lineups.json に行が無いが、
      festival-de-frue の復活で件数としては 10 に達した。

  artist_appearances_pages:
    description: <h2>出演フェス</h2> セクションを持つアーティストページ数（JA）
    min: 71
    target: 94                # 【本来の目標値】データ整備で到達すべき値
    note: >-
      2026-08-01: 64 → 71。data/*.json 再生成で、ID是正した7名
      （Acid Pauli 他、festival-de-frue 出演）の逆引きが復活した。
      以下は 64 時点の分析。残る差 23ページの内訳:
      (a) 8ページ = 復旧可能とした分。うち7件は 2026-08-01 に復旧済み。
      festival-de-frue 出演の7件
      （Acid Pauli / Alabaster DePlume / Juana Molina / Kiko Dinucci /
      Kuo from Sunset Rollercoaster / Sylvan Esso /
      The Master Musicians of Joujouka）と、旧合体ID 1件
      （sisi-b2b-ouissam-b2b-yamarchy → rainbow-disco-club）。
      前者は ID是正で lineups.json 側の名前解決が通り復旧した。
      後者は B2B を単一アーティストとして登録していた旧データの遺物で、
      DATA_SCHEMA §2.2（B2B・ユニットは登録しない）に反するため、
      LINEUPS の複合枠対応で解決すべきもの。復旧させてはいけない。
      (b) 22ページ = 監査時点(51f6b8f)からのデータ変化によるもので、
      復元元が残っていない。旧実装は FESTIVALS.LINEUP の名前文字列を
      ARTISTS.NAME と突合していたため、当時のシート上の文字列に依存していた。
      その文字列は既に上書きされており、どのアーティストが拾われていたかを
      再現できない。ARTISTS への登録を進めて積み上げるほかない。

  internal_links_to_artists:
    description: フェスページから /artists/ への内部リンク総数（JA、script 外）
    min: 75
    target: null
    note: >-
      ラインナップからアーティスト詳細へのリンク。エンティティグラフの実体。
      performer 総数と 1:1 で対応する（ACT_LABEL のみの枠はリンクを持たない）。
      2026-08-01: 68 → 75。

  internal_links_to_festivals:
    description: アーティストページから /festivals/ への内部リンク総数（JA、script 外）
    min: 75
    target: null
    note: >-
      出演フェス欄からの逆引きリンク。順方向と同数になる。
      2026-08-01: 68 → 75。

  # 以下は 948a440 で導入され、現在は本番で稼働中。
  festival_subevent_pages:
    description: JSON-LD に subEvent（開催回）を持つフェスページ数（JA）
    min: 86
    target: 86
    note: editions.json 由来。全フェスが対象なので min == target。

  artist_entity_id_pages:
    description: アーティスト JSON-LD に @id を持つページ数（JA + EN）
    min: 200
    target: null              # ARTISTS の件数に比例して増えるため固定目標を置かない
    note: >-
      監査 B2（エンティティ間リンク）の基盤。ARTISTS 件数 × JA/EN の2ページ。
      2026-08-01: 97件(194ページ) → 100件(200ページ)。
      新規3件の追加と、B2B 2件（antal-hunee / sisi-b2b-ouissam-b2b-yamarchy）の
      削除が同時に入った結果。リダイレクトスタブは @id を持たないので数に入らない。

  # 2026-08-01 に追加された FAQ と要約文（f19e831 / e763cbf）。
  # 監査 C1「FAQPage がサイト全体で 0件」と C-2（自然言語の質問を見出しに）への対応。
  festival_faq_pages:
    description: JSON-LD に FAQPage を持つフェスページ数（JA + EN）
    min: 172
    target: 172
    note: 全86フェス × JA/EN。全件が対象なので min == target。

  festival_faq_section_pages:
    description: <section class="festival-faq"> を持つフェスページ数（JA + EN）
    min: 172
    target: 172
    note: >-
      スキーマ(festival_faq_pages)と可視HTMLの両方を見る。片方だけ壊れる
      ことがあるため別メトリクスにしている。構造化データだけあって画面に
      出ていない状態は Google のガイドライン違反にもなる。

  festival_faq_qa_total:
    description: FAQPage の mainEntity（Q&A）の総数（JA + EN 合算）
    min: 376
    target: null              # 設問はデータの充実度で増えるため固定目標を置かない
    note: >-
      ページ数だけだと 1ページの設問が 4問 → 1問に減っても検出できないので
      総数を持つ。2026-08-01 実測 376（JA 188 + EN 188）。
      1ページあたりの内訳は 1問:1ページ / 2問:74 / 3問:5 / 4問:6（各言語）。
      min を片言語分の 188 にすると EN の全設問が消えても通ってしまうため、
      合算値を基準にする。設問数は DATE・会場・チケットURL 等の有無で
      決まるので、データが欠けると静かに減る。減ったら回帰。

  festival_summary_pages:
    description: <p class="festival-summary"> を持つフェスページ数（JA + EN）
    min: 172
    target: 172
    note: >-
      指示書 Phase C-1（結論ファースト / BLUF）に対応する要約文。
      全86フェス × JA/EN。

  submit_link_pages:
    description: 掲載申請ページ（submit.html）へのリンクを持つページ数
    min: 426
    target: null              # 詳細ページの増減に比例するため固定目標を置かない
    note: >-
      2026-08-01 に submit.html を公開。全ページのフッターから導線を張っている。
      リンクが無い21ページはすべて noindex かリダイレクトスタブで意図どおり
      （404 / cms / map / 旧IDスタブ14件 等）。
      テンプレート変更でフッターの導線が静かに消えるのを防ぐ。
      詳細ページが増えれば増えるので、減ったら回帰。

  en_hub_leaks_to_ja:
    description: EN ハブから JA 詳細ページへ漏れているリンクの数
    min: 0
    max: 0                    # 増加方向が回帰
    target: 0
    note: >-
      EN ハブは JA ハブから機械生成する（enHubFromJa）。置換漏れがあると
      英語ユーザーが日本語ページへ飛ばされる。実装時に実際に踏んだ:
      静的リンク・data.js の読み込みパス・index.html の相対表記の3箇所。
      生成物を検査して 0 を維持する。

  hub_language_toggles:
    description: 言語トグルが正しく相手言語へリンクしているハブ数（JA 6 + EN 6）
    min: 12
    target: null              # ハブが増えれば増える
    note: >-
      「存在するか」ではなく「相手言語の正しいURLへリンクしているか」まで見る。
      JA→/en/xxx.html、EN→/xxx.html。片方向だけ壊れる事故を検出するため。
      判定に正規表現を使わない: nav-lang の中身は JA/EN で非対称
      （JA は </a></span>、EN は </span></span> で終わる）ため、
      `<span class="nav-lang">(.*?)</span></span>` と書くと JA 側だけ
      マッチせず誤検出する。実際に一度「トグルが無い」と誤報告した。
      生成側が出す固定文字列をそのまま探す。

  hreflang_hub_pages:
    description: hreflang を持つハブページ数（JA 5 + EN 5 = index/festivals/artists/venues/news/about）
    min: 12
    target: null              # ハブが増えれば増える
    note: >-
      2026-08-02 まで JA ハブ8枚に hreflang が1本も無かった。
      JA/EN を相互に張り、x-default は EN（詳細ページの既存規則に合わせる）。

  broken_image_refs:
    description: 生成HTMLが参照する /images/ で実体が存在しないものの件数
    min: 0
    max: 0                    # 増加方向が回帰なので max で判定する
    target: 0
    note: >-
      監査 B4 で 8件 → 0件に解消済み。<img> だけでなく og:image /
      twitter:image / JSON-LD image も対象。

  artist_id_violations:
    description: DATA_SCHEMA §1.1 の slug 規約に反するアーティストIDの件数
    min: 0
    max: 0                    # 増加方向が回帰。7件の是正完了により 0 へ引き下げ済み
    target: 0
    note: >-
      2026-08-01 に 7件 → 0件。一括登録時に ID 欄へ NAME をそのまま貼った
      （大文字・スペース入りで URL に %20 が出ていた）分をスラッグへ是正し、
      旧URLは REDIRECTS のスタブで維持している。
      計測はリダイレクトスタブを除外する（スタブは旧ID名のファイルとして
      意図的に残るため、除外しないと永久に 0 にならない）。
      検査を生成物のファイル名で行う理由: fetch-data.mjs は ID を検証して
      exit(1) するが、詳細ページの元になる data.js は CMS の Publish Now(GAS)
      が生成する別経路で、その検証を通らない。ここが実質唯一の自動関門。

# ハブページの JS 健全性（scripts/check_hub_pages.py）
#
# 生成物の静的検査では「JS は配信されているが実行時に死ぬ」障害を検出できない。
# 2026-07-22 から 10日間 festivals.html の一覧が表示されていなかった事故
# （data.js の DATE 欠落 → getYearFromDate が undefined.split() で例外 →
# ページ全体の JS 停止）を受けて追加した。
#
# marker には「JS だけが生成するクラス名」を指定する。静的リンクの
# フォールバックが残っていても描画失敗を検出できるようにするため。
# min_markers は実測値から余裕を持たせた値（データ件数の増減で多少ぶれる）。
hub_pages:
  festivals.html:
    container: festivals-main
    marker: festival-layout        # フェスカード。JS の renderFestivals が生成
    min_markers: 50                # 実測 70（86件中、表示対象のフェスカード）
    min_container_bytes: 60000     # 実測 112,911。JS 停止時は 9,130 まで落ちた
  artists.html:
    marker: artist-card
    min_markers: 70                # 実測 101
    min_container_bytes: 40000     # 実測 66,260
  venues.html:
    marker: venue-card
    min_markers: 18                # 実測 23
    min_container_bytes: 10000     # 実測 17,101
  news.html:
    marker: feed-card              # news は <main> を使わず別コンテナへ描画する
    min_markers: 1                 # 実測 1（ARTICLES が1件のみのため）
    min_container_bytes: 0         # <main> は空が正常
  # submit は静的ページで JS 描画を持たない。marker は静的セクションを数えるので
  # 「JS が描画したか」ではなく「ページが正しく配信され本文が存在するか」の検査になる。
  # Uncaught 例外の検出は他ページと同じく有効。
  submit.html:
    container: main-content
    marker: submit-section
    min_markers: 3                 # 実測 3
    min_container_bytes: 800       # 実測 1,100
  en/submit.html:
    container: main-content
    marker: submit-section
    min_markers: 3                 # 実測 3
    min_container_bytes: 800       # 実測 1,640
  # EN ハブ（build-detail-pages.mjs が JA から機械生成する）。
  # marker と閾値は JA と同じでよい。同じ data.js を読むのでカード数も一致する。
  en/festivals.html:
    container: festivals-main
    marker: festival-layout
    min_markers: 50                # 実測 71
    min_container_bytes: 60000
  en/artists.html:
    marker: artist-card
    min_markers: 70                # 実測 101
    min_container_bytes: 40000
  en/venues.html:
    marker: venue-card
    min_markers: 18                # 実測 23
    min_container_bytes: 10000
  en/news.html:
    marker: feed-card
    min_markers: 1                 # 実測 1
    min_container_bytes: 0
  en/index.html:
    # TOP は他ハブと構成が違い、<main> もカード用の共通クラスも持たない。
    # 静的に必ず存在するセクション見出し(.section-head)を存在確認に使う。
    marker: section-head
    min_markers: 4                 # 実測 4（NEWS / FESTIVALS / ARTISTS / VENUES）
    min_container_bytes: 0
