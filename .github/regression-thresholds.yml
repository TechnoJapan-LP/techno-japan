# 生成物の回帰ガード — 閾値定義
#
# 目的:
#   build-detail-pages.mjs の改修で、構造化データや内部リンクが
#   気づかれずに消えるのを防ぐ。「ページ数は増えても減らない」という
#   単調性だけを検査する（増加は常に許可、減少は fail）。
#
# 経緯:
#   948a440「Implement festival edition history and entity IDs」で
#   旧 f.lineup からの出力を廃止した際、lineups.json からの再実装が
#   未着手のまま本番へデプロイされ、以下が失われた。
#     - Festival.performer  約130件（10フェス分）
#     - <h2>LINE UP</h2>    10ページ
#     - <h2>出演フェス</h2>  94ページ
#   ローカルの diff で検出可能だったが、実行されずに push された。
#   このファイルは同種の事故を機械的に止めるための基準値。
#
# 運用:
#   min の値を下回ったら fail。意図的な減少なら min を更新してコミットし、
#   理由を note に書く（サイレントな引き下げを避けるため必須）。
#   target は「データ整備で到達すべき目標」で、CI の合否には使わない。
#
# ステータス: 【確定済み — 2026-08-01】
#   min は lineups.json 実装完了時(91491eb)の実測値。
#   回帰前(334bd19)の値は基準にしない。lineups.json の現データでは復旧上限が
#   旧実装を下回るため、達成不可能な閾値になり CI が恒久的に赤くなる。
#   到達すべき値は target に分けて記録している。

version: 1
baseline_commit: 91491eb   # Regenerate lineup and appearance pages
baseline_measured_at: 2026-08-01

metrics:
  festival_performer_pages:
    description: JSON-LD の Festival.performer を1件以上持つフェスページ数（JA）
    min: 8
    target: 10                # 【本来の目標値】旧実装で LINE UP が出ていたフェス数
    note: >-
      min(8) < target(10) の差はデータ未整備が原因。
      festival-de-frue と osukinidouzo は lineups.json に行が存在しない
      （旧実装は FESTIVALS.LINEUP 文字列から直接出力していたため出ていた）。
      この2件を EDITIONS/LINEUPS に登録すれば target に到達する。
      内訳: 99flags, ala, arch, matricaria, paramount, rainbow-disco-club,
      transcendence, waifu

  festival_performer_total:
    description: Festival.performer の総件数（JA、全フェス合計）
    min: 68
    target: null              # ARTIST_ID の解決状況に依存するため固定目標を置かない
    note: >-
      lineups.json 123行のうち ARTIST_ID が解決済みの 68行に対応する。
      残り 55行は ACT_LABEL のみで performer に出さない
      （複合枠5件 + ARTISTS 未登録の単独枠50件）。
      ARTISTS への登録を進めれば増える。減ったら回帰。

  lineup_section_pages:
    description: <h2>LINE UP</h2> セクションを持つフェスページ数（JA）
    min: 9
    target: 10                # 【本来の目標値】旧実装と同じ 10フェス
    note: >-
      ACT_LABEL のみの行でも見出しは出るため performer(8) より 1件多い。
      差の 1件は the-star-festival（15行すべて ARTIST_ID 未解決）。
      target との差 1件は osukinidouzo（lineups.json 未登録）。

  artist_appearances_pages:
    description: <h2>出演フェス</h2> セクションを持つアーティストページ数（JA）
    min: 64
    target: 94                # 【本来の目標値】データ整備で到達すべき値
    note: >-
      min(64) と target(94) の差 30ページの内訳:
      (a) 8ページ = 復旧可能。festival-de-frue 出演の7件
      （Acid Pauli / Alabaster DePlume / Juana Molina / Kiko Dinucci /
      Kuo from Sunset Rollercoaster / Sylvan Esso /
      The Master Musicians of Joujouka）と、旧合体ID 1件
      （sisi-b2b-ouissam-b2b-yamarchy → rainbow-disco-club）。
      前者は festival-de-frue を EDITIONS/LINEUPS に登録すれば復旧する。
      後者は B2B を単一アーティストとして登録していた旧データの遺物で、
      DATA_SCHEMA §2.2（B2B・ユニットは登録しない）に反するため、
      LINEUPS の複合枠対応で解決すべきもの。復旧させてはいけない。
      (b) 22ページ = 監査時点(51f6b8f)からのデータ変化によるもので、
      復元元が残っていない。旧実装は FESTIVALS.LINEUP の名前文字列を
      ARTISTS.NAME と突合していたため、当時のシート上の文字列に依存していた。
      その文字列は既に上書きされており、どのアーティストが拾われていたかを
      再現できない。ARTISTS への登録を進めて積み上げるほかない。

  internal_links_to_artists:
    description: フェスページから /artists/ への内部リンク総数（JA、script 外）
    min: 68
    target: null
    note: >-
      ラインナップからアーティスト詳細へのリンク。エンティティグラフの実体。
      performer 総数と 1:1 で対応する（ACT_LABEL のみの枠はリンクを持たない）。

  internal_links_to_festivals:
    description: アーティストページから /festivals/ への内部リンク総数（JA、script 外）
    min: 68
    target: null
    note: 出演フェス欄からの逆引きリンク。順方向と同数になる。

  # 以下は 948a440 で導入され、現在は本番で稼働中。
  festival_subevent_pages:
    description: JSON-LD に subEvent（開催回）を持つフェスページ数（JA）
    min: 86
    target: 86
    note: editions.json 由来。全フェスが対象なので min == target。

  artist_entity_id_pages:
    description: アーティスト JSON-LD に @id を持つページ数（JA + EN）
    min: 200
    target: null              # ARTISTS の件数に比例して増えるため固定目標を置かない
    note: >-
      監査 B2（エンティティ間リンク）の基盤。ARTISTS 件数 × JA/EN の2ページ。
      2026-08-01: 97件(194ページ) → 100件(200ページ)。
      新規3件の追加と、B2B 2件（antal-hunee / sisi-b2b-ouissam-b2b-yamarchy）の
      削除が同時に入った結果。リダイレクトスタブは @id を持たないので数に入らない。

  broken_image_refs:
    description: 生成HTMLが参照する /images/ で実体が存在しないものの件数
    min: 0
    max: 0                    # 増加方向が回帰なので max で判定する
    target: 0
    note: >-
      監査 B4 で 8件 → 0件に解消済み。<img> だけでなく og:image /
      twitter:image / JSON-LD image も対象。

  artist_id_violations:
    description: DATA_SCHEMA §1.1 の slug 規約に反するアーティストIDの件数
    min: 0
    max: 0                    # 増加方向が回帰。7件の是正完了により 0 へ引き下げ済み
    target: 0
    note: >-
      2026-08-01 に 7件 → 0件。一括登録時に ID 欄へ NAME をそのまま貼った
      （大文字・スペース入りで URL に %20 が出ていた）分をスラッグへ是正し、
      旧URLは REDIRECTS のスタブで維持している。
      計測はリダイレクトスタブを除外する（スタブは旧ID名のファイルとして
      意図的に残るため、除外しないと永久に 0 にならない）。
      検査を生成物のファイル名で行う理由: fetch-data.mjs は ID を検証して
      exit(1) するが、詳細ページの元になる data.js は CMS の Publish Now(GAS)
      が生成する別経路で、その検証を通らない。ここが実質唯一の自動関門。

# ハブページの JS 健全性（scripts/check_hub_pages.py）
#
# 生成物の静的検査では「JS は配信されているが実行時に死ぬ」障害を検出できない。
# 2026-07-22 から 10日間 festivals.html の一覧が表示されていなかった事故
# （data.js の DATE 欠落 → getYearFromDate が undefined.split() で例外 →
# ページ全体の JS 停止）を受けて追加した。
#
# marker には「JS だけが生成するクラス名」を指定する。静的リンクの
# フォールバックが残っていても描画失敗を検出できるようにするため。
# min_markers は実測値から余裕を持たせた値（データ件数の増減で多少ぶれる）。
hub_pages:
  festivals.html:
    container: festivals-main
    marker: festival-layout        # フェスカード。JS の renderFestivals が生成
    min_markers: 50                # 実測 70（86件中、表示対象のフェスカード）
    min_container_bytes: 60000     # 実測 112,911。JS 停止時は 9,130 まで落ちた
  artists.html:
    marker: artist-card
    min_markers: 70                # 実測 101
    min_container_bytes: 40000     # 実測 66,260
  venues.html:
    marker: venue-card
    min_markers: 18                # 実測 23
    min_container_bytes: 10000     # 実測 17,101
  news.html:
    marker: feed-card              # news は <main> を使わず別コンテナへ描画する
    min_markers: 1                 # 実測 1（ARTICLES が1件のみのため）
    min_container_bytes: 0         # <main> は空が正常
